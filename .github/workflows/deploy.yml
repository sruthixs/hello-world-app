name: Deploy Web App

on:
  push:
    branches:
      - main  # Trigger pipeline on pushing to main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'  # Use Node version 14

      - name: Install dependencies
        run: npm install  # Install dependencies

      - name: Run tests
        run: npm test  # Run tests

      - name: Build the app
        run: npm run build  # Build the production version of the app

      - name: Deploy to AWS EC2
        run: |
          ssh -i your-ec2-key.pem ec2-user@your-ec2-ip 'docker pull your-image && docker run your-image'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
